  input:
    quantity_label: "<gray>Quantité :</gray>"
    promo_label: "<gray>Message publicitaire :</gray>"
  blackmarket:
    title: "<white>Marché Noir</white>"
    closed_title: "<white>Marché Noir Fermé</white>"
    body: "<red>Bienvenue au Marché Noir clandestin. Tous les objets bénéficient d'une réduction de <yellow><discount></yellow> !</red>\n<gray>Temps restant dans cette session : <aqua><remaining></aqua></gray>\n<gray>Votre solde : <yellow>$<balance></yellow></gray>\n<dark_gray>Remarque : Vous ne pouvez pas vous déplacer pendant vos transactions.</dark_gray>"
  promosi:
    title: "<white>Promotions</white>"
    body: "<gray>Louez une diffusion d'annonce automatisée pour tout le serveur.</gray>\n<gray>Coût : <yellow>$<cost></yellow> | Durée : <yellow><duration> minutes</yellow></gray>\n<gray>Créneaux actifs : <yellow><active_count>/<max_slots></yellow> | Solde : <yellow>$<balance></yellow></gray>"
  jobs:
    title: "<white>Métiers</white>"
    no_job_title: "<white>Métiers</white>"
    no_job_body: "<white>Vous n'avez pas encore choisi de profession active.</white>\n\n<gray>Le système de métiers vous permet de gagner de <yellow>l'argent</yellow> et de <aqua>l'EXP de Métier</aqua> lors de vos activités quotidiennes.</gray>\n\n<gray>Avantages & Fonctionnalités :</gray>\n<gray>• <white>10 Métiers Uniques</white> adaptés à votre style de jeu.</gray>\n<gray>• <green>Buff Passif Permanent</green> débloqué au Niveau 50.</gray>\n<gray>• <aqua>Buff d'Aura</aqua> partagé avec vos alliés proches (10 blocs).</gray>\n\n<dark_gray>Choisissez votre métier ci-dessous ou consultez le guide.</dark_gray>"
    body: "<white>Détails de votre Profession :</white>\n\n<gray>Profession : <yellow><job></yellow></gray>\n<gray>Niveau : <white><level></white><gray>/<max_level></gray> | EXP : <aqua><exp></aqua><gray>/<req_exp></gray> (<green><exp_percent>%</green>)</gray>\n\n<gray>Buff Personnel (Nv 50) : <green><self_buff></green></gray>\n<gray>Buff d'Aura Proche : <aqua><aura_buff></aqua></gray>\n\n<dark_gray>Remarque : Changer de métier coûte $<reset_cost> et réinitialise le niveau à 1.</dark_gray>"
    select_title: "<white>Choisir un Métier</white>"
    select_body: "<gray>Sélectionnez l'un des 10 métiers ci-dessous pour voir les détails ou changer.</gray>"
    btn_choose_now: "<green>Choisir un Métier Maintenant</green>"
    btn_change_job: "<gold>Changer de Métier</gold>"
    btn_guide: "<yellow>Guide & Astuces des Métiers</yellow>"
    btn_main_menu: "<aqua>Retour au Menu Principal</aqua>"
    btn_select_job: "<green>Choisir ce Métier</green>"
  jobs_guide:
    title: "<white>Guide des Métiers</white>"
    body: "<white>Guide du Système de Métiers :</white>\n\n<yellow>1. Gagner de l'EXP et de l'Argent</yellow>\n<gray>Toute action correspondant à votre métier (comme miner pour le Mineur, couper du bois pour le Bûcheron, pêcher pour le Pêcheur, etc.) rapporte directement de <yellow>l'argent</yellow> et de <aqua>l'EXP de Métier</aqua>.</gray>\n\n<yellow>2. Progression & Niveaux</yellow>\n<gray>Le niveau maximum est fixé au <white>Niveau 50</white>. Plus votre niveau est élevé, plus les gains par activité augmentent.</gray>\n\n<yellow>3. Buffs de Maîtrise (Niveau 50)</yellow>\n<gray>Au Niveau 50, vous débloquez un <green>Buff Passif Permanent</green> pour vous-même et une <aqua>Aura</aqua> qui renforce périodiquement vos compagnons dans un rayon de 10 blocs.</gray>\n\n<yellow>4. Changer de Métier</yellow>\n<gray>Vous pouvez changer de profession à tout moment pour <yellow>$<reset_cost></yellow>. Le nouveau métier commencera au Niveau 1.</gray>"
    btn_all_jobs: "<yellow>Voir les 10 Métiers & Buffs</yellow>"
    list_title: "<white>Aperçu des Métiers</white>"
    list_body: "<gray>Sélectionnez un métier ci-dessous pour voir ses tâches et ses buffs de Niveau 50 :</gray>"
  job_details:
    title: "<white><job></white>"
    body: "<white>Profession : <yellow><job></yellow></white>\n<gray><description></gray>\n\n<white>Récompenses de Niveau Maximum (Nv 50) :</white>\n<gray>• Buff Personnel : <green><self_buff></green></gray>\n<gray>• Buff d'Aura des Joueurs Proches : <aqua><aura_buff></aqua></gray>\n\n<white>Conditions de Changement :</white>\n<gray>• Frais de Changement : <yellow>$<cost></yellow></gray>\n<gray>• Votre Solde : <yellow>$<balance></yellow></gray>\n\n<dark_gray>Remarque : Changer de métier réinitialise le niveau à 1.</dark_gray>"
  job_confirm:
    title: "<white>Confirmer le Changement de Métier</white>"
    body: "<red>Attention : Passer au métier <white><job></white> coûtera <yellow>$<cost></yellow> et RÉINITIALISERA votre niveau à 1 !</red>\n\n<gray>Voulez-vous continuer ?</gray>"
