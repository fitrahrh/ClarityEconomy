  buy_confirm:
    title: "<white>Confirmar Compra</white>"
    body: "<gray>Tem certeza de que deseja comprar <white><amount>x <item></white> por <yellow>$<cost></yellow>?</gray>\n<gray>Seu saldo: <yellow>$<balance></yellow></gray>"
  sell_input:
    title: "<white>Vender <item></white>"
    body: "<gray>Insira a quantidade de <white><item></white> que deseja vender.</gray>\n<gray>Pagamento unitário: <gold>$<unit_payout></gold> | No Inventário: <yellow><inv_count></yellow></gray>"
  sell_confirm:
    title: "<white>Confirmar Venda</white>"
    body: "<gray>Tem certeza de que deseja vender <white><amount>x <item></white> por <yellow>$<payout></yellow>?</gray>\n<gray>Seu saldo: <yellow>$<balance></yellow></gray>"
  input:
    quantity_label: "<gray>Quantidade:</gray>"
    promo_label: "<gray>Mensagem do anúncio:</gray>"
  blackmarket:
    title: "<white>Mercado Negro</white>"
    closed_title: "<white>Mercado Negro Fechado</white>"
    body: "<red>Bem-vindo ao secreto Mercado Negro. Todos os itens com desconto de <yellow><discount></yellow>!</red>\n<gray>Tempo restante nesta sessão: <aqua><remaining></aqua></gray>\n<gray>Seu saldo: <yellow>$<balance></yellow></gray>\n<dark_gray>Aviso: Você não pode se mover durante as transações.</dark_gray>"
  promosi:
    title: "<white>Promoções</white>"
    body: "<gray>Alugue uma transmissão automática de anúncios para todo o servidor.</gray>\n<gray>Custo: <yellow>$<cost></yellow> | Duração: <yellow><duration> minutos</yellow></gray>\n<gray>Vagas ativas: <yellow><active_count>/<max_slots></yellow> | Saldo: <yellow>$<balance></yellow></gray>"
  jobs:
    title: "<white>Profissões</white>"
    no_job_title: "<white>Profissões</white>"
    no_job_body: "<white>Você ainda não escolheu uma profissão ativa.</white>\n\n<gray>O sistema de profissões permite ganhar <yellow>dinheiro</yellow> e <aqua>XP de Profissão</aqua> sempre que realizar atividades do seu trabalho.</gray>\n\n<gray>Principais Vantagens:</gray>\n<gray>• <white>10 Profissões Únicas</white> adequadas ao seu estilo.</gray>\n<gray>• <green>Buff Passivo Permanente</green> liberado no Nível 50.</gray>\n<gray>• <aqua>Aura de Buff</aqua> compartilhada com aliados próximos (10 blocos).</gray>\n\n<dark_gray>Escolha sua profissão abaixo ou consulte o guia.</dark_gray>"
    body: "<white>Detalhes da sua Profissão:</white>\n\n<gray>Profissão: <yellow><job></yellow></gray>\n<gray>Nível: <white><level></white><gray>/<max_level></gray> | EXP: <aqua><exp></aqua><gray>/<req_exp></gray> (<green><exp_percent>%</green>)</gray>\n\n<gray>Buff Próprio (Nv 50): <green><self_buff></green></gray>\n<gray>Aura para Aliados Próximos: <aqua><aura_buff></aqua></gray>\n\n<dark_gray>Nota: Trocar de profissão custa $<reset_cost> e reinicia o nível para 1.</dark_gray>"
    select_title: "<white>Escolher Profissão</white>"
    select_body: "<gray>Selecione uma das 10 profissões abaixo para ver detalhes ou trocar.</gray>"
    btn_choose_now: "<green>Escolher Profissão Agora</green>"
    btn_change_job: "<gold>Mudar de Profissão</gold>"
    btn_guide: "<yellow>Guia & Dicas de Profissões</yellow>"
    btn_main_menu: "<aqua>Voltar ao Menu Principal</aqua>"
    btn_select_job: "<green>Escolher esta Profissão</green>"
  jobs_guide:
    title: "<white>Guia de Profissões</white>"
    body: "<white>Guia do Sistema de Profissões:</white>\n\n<yellow>1. Ganho de EXP e Dinheiro</yellow>\n<gray>Toda ação correspondente à sua profissão (como minerar para o Minerador, cortar madeira para o Lenhador, pescar para o Pescador, etc.) credita <yellow>dinheiro</yellow> diretamente em sua conta e adiciona <aqua>XP de Profissão</aqua>.</gray>\n\n<yellow>2. Progressão e Níveis</yellow>\n<gray>O nível máximo é o <white>Nível 50</white>. Níveis mais altos aumentam os ganhos obtidos em cada atividade.</gray>\n\n<yellow>3. Buffs de Maestria (Nível 50)</yellow>\n<gray>Ao atingir o Nível 50 você desbloqueia um <green>Buff Passivo Permanente</green> para si mesmo e uma <aqua>Aura</aqua> que beneficia periodicamente jogadores em um raio de 10 blocos.</gray>\n\n<yellow>4. Troca de Profissão</yellow>\n<gray>Você pode mudar de profissão a qualquer momento pagando uma taxa de <yellow>$<reset_cost></yellow>. A nova profissão começará no Nível 1.</gray>"
    btn_all_jobs: "<yellow>Ver Todas as 10 Profissões e Buffs</yellow>"
    list_title: "<white>Visão Geral das Profissões</white>"
    list_body: "<gray>Selecione uma profissão abaixo para ver detalhes de tarefas e buffs do Nível 50:</gray>"
  job_details:
    title: "<white><job></white>"
    body: "<white>Profissão: <yellow><job></yellow></white>\n<gray><description></gray>\n\n<white>Recompensas do Nível Máximo (Nv 50):</white>\n<gray>• Buff Próprio: <green><self_buff></green></gray>\n<gray>• Aura para Jogadores Próximos: <aqua><aura_buff></aqua></gray>\n\n<white>Requisitos para Alteração:</white>\n<gray>• Taxa de Troca: <yellow>$<cost></yellow></gray>\n<gray>• Seu Saldo: <yellow>$<balance></yellow></gray>\n\n<dark_gray>Aviso: Mudar de profissão reinicia o nível para 1.</dark_gray>"
  job_confirm:
    title: "<white>Confirmar Mudança de Profissão</white>"
    body: "<red>Aviso: Mudar para a profissão de <white><job></white> custará <yellow>$<cost></yellow> e REINICIARÁ seu nível para 1!</red>\n\n<gray>Deseja continuar?</gray>"
