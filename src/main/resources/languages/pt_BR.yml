    btn_back: "<gray>Voltar</gray>"
    btn_close: "<red>Fechar</red>"
  market:
    title: "<white>Mercado</white>"
    body: "<gray>Bem-vindo ao mercado oficial do servidor. Selecione uma categoria abaixo para navegar pelos itens.</gray>\n<gray>Seu saldo: <yellow>$<balance></yellow></gray>"
  category:
    title: "<white><category></white>"
