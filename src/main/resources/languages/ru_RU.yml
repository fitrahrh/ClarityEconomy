    title: "<white>Купить <item></white>"
    body: "<gray>Введите количество <white><item></white> для покупки.</gray>\n<gray>Цена за штуку: <green>$<unit_price></green> | Баланс: <yellow>$<balance></yellow></gray>"
  buy_confirm:
    title: "<white>Подтверждение покупки</white>"
    body: "<gray>Вы уверены, что хотите купить <white><amount>x <item></white> за <yellow>$<cost></yellow>?</gray>\n<gray>Ваш баланс: <yellow>$<balance></yellow></gray>"
  sell_input:
    title: "<white>Продать <item></white>"
    body: "<gray>Введите количество <white><item></white> для продажи.</gray>\n<gray>Выплата за штуку: <gold>$<unit_payout></gold> | В инвентаре: <yellow><inv_count></yellow></gray>"
