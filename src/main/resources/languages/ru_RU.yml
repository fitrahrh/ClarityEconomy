    body: "<gray>Предмет: <white><item></white></gray>\n<gray>Покупка: <green>$<buy_price></green></gray>\n<gray>Продажа: <gold>$<sell_price></gold></gray>\n<gray>В инвентаре: <yellow><inv_count></yellow></gray>\n<gray>Баланс: <yellow>$<balance></yellow></gray>"
