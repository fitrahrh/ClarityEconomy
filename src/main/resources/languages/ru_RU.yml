    title: "<white>Подтверждение продажи</white>"
    body: "<gray>Вы уверены, что хотите продать <white><amount>x <item></white> за <yellow>$<payout></yellow>?</gray>\n<gray>Ваш баланс: <yellow>$<balance></yellow></gray>"
  input:
    quantity_label: "<gray>Количество:</gray>"
    promo_label: "<gray>Текст объявления:</gray>"
  blackmarket:
    title: "<white>Черный рынок</white>"
    closed_title: "<white>Черный рынок закрыт</white>"
    body: "<red>Добро пожаловать на Черный рынок. Скидка на все товары <yellow><discount></yellow>!</red>\n<gray>До окончания сессии: <aqua><remaining></aqua></gray>\n<gray>Ваш баланс: <yellow>$<balance></yellow></gray>\n<dark_gray>Внимание: Во время сделки движение заблокировано.</dark_gray>"
  promosi:
    title: "<white>Реклама</white>"
    body: "<gray>Аренда автоматического показа объявлений на весь сервер.</gray>\n<gray>Цена: <yellow>$<cost></yellow> | Длительность: <yellow><duration> мин.</yellow></gray>\n<gray>Занято слотов: <yellow><active_count>/<max_slots></yellow> | Баланс: <yellow>$<balance></yellow></gray>"
  jobs:
    title: "<white>Профессии</white>"
    no_job_title: "<white>Профессии</white>"
    no_job_body: "<white>В данный момент у вас не выбрана профессия.</white>\n\n<gray>Система профессий позволяет зарабатывать <yellow>деньги</yellow> и <aqua>опыт профессии</aqua> за выполнение профильных действий.</gray>\n\n<gray>Преимущества и особенности:</gray>\n<gray>• <white>10 уникальных профессий</white> под любой стиль игры.</gray>\n<gray>• <green>Постоянный пассивный бафф</green> на 50 уровне.</gray>\n<gray>• <aqua>Аура союзников</aqua> в радиусе 10 блоков вокруг вас.</gray>\n\n<dark_gray>Выберите профессию кнопкой ниже или откройте руководство.</dark_gray>"
    body: "<white>Информация о профессии:</white>\n\n<gray>Профессия: <yellow><job></yellow></gray>\n<gray>Уровень: <white><level></white><gray>/<max_level></gray> | Опыт: <aqua><exp></aqua><gray>/<req_exp></gray> (<green><exp_percent>%</green>)</gray>\n\n<gray>Собственный бафф (Ур. 50): <green><self_buff></green></gray>\n<gray>Аура для союзников: <aqua><aura_buff></aqua></gray>\n\n<dark_gray>Смена профессии стоит $<reset_cost> и сбрасывает уровень до 1.</dark_gray>"
    select_title: "<white>Выбор профессии</white>"
    select_body: "<gray>Выберите одну из 10 доступных профессий ниже для подробностей:</gray>"
    btn_choose_now: "<green>Выбрать профессию сейчас</green>"
    btn_change_job: "<gold>Сменить профессию</gold>"
    btn_guide: "<yellow>Гайд и советы по профессиям</yellow>"
    btn_main_menu: "<aqua>В главное меню</aqua>"
    btn_select_job: "<green>Выбрать эту профессию</green>"
  jobs_guide:
    title: "<white>Гайд по профессиям</white>"
    body: "<white>Руководство по системе профессий:</white>\n\n<yellow>1. Получение опыта и денег</yellow>\n<gray>Любое действие по выбранной специальности (например, копка руды у Шахтера, рубка леса у Лесоруба и т.д.) сразу зачисляет <yellow>деньги</yellow> на счет и приносит <aqua>опыт профессии</aqua>.</gray>\n\n<yellow>2. Прокачка и уровни</yellow>\n<gray>Максимальный уровень — <white>50 уровень</white>. С ростом уровня увеличивается доход за каждую активность.</gray>\n\n<yellow>3. Мастерство (50 Уровень)</yellow>\n<gray>На 50 уровне открывается <green>постоянный пассивный бафф</green> для вас, а также <aqua>аура</aqua>, которая периодически накладывает эффекты на игроков рядом (10 блоков).</gray>\n\n<yellow>4. Смена специальности</yellow>\n<gray>Сменить профессию можно в любое время за <yellow>$<reset_cost></yellow>. Прокачка новой профессии начнется с 1 уровня.</gray>"
    btn_all_jobs: "<yellow>Список 10 профессий и баффов</yellow>"
    list_title: "<white>Обзор профессий</white>"
    list_body: "<gray>Выберите профессию, чтобы узнать действия и баффы 50 уровня:</gray>"
  job_details:
    title: "<white><job></white>"
    body: "<white>Профессия: <yellow><job></yellow></white>\n<gray><description></gray>\n\n<white>Награды за 50 уровень:</white>\n<gray>• Собственный бафф: <green><self_buff></green></gray>\n<gray>• Аура для союзников: <aqua><aura_buff></aqua></gray>\n\n<white>Условия смены:</white>\n<gray>• Стоимость: <yellow>$<cost></yellow></gray>\n<gray>• Ваш баланс: <yellow>$<balance></yellow></gray>\n\n<dark_gray>Примечание: Смена профессии сбросит уровень на 1.</dark_gray>"
  job_confirm:
    title: "<white>Подтверждение смены профессии</white>"
    body: "<red>Внимание: Смена профессии на <white><job></white> стоит <yellow>$<cost></yellow> и СБРОСИТ ваш уровень на 1!</red>\n\n<gray>Желаете продолжить?</gray>"
