    name: "Алхимик"
    description: "Получайте опыт и деньги за варку магических зелий."
  lumberjack:
    name: "Лесоруб"
    description: "Получайте опыт и деньги за рубку деревьев и заготовку древесины."
  digger:
    name: "Землекоп"
    description: "Получайте опыт и деньги за раскопку земли, песка, глины и гравия."

