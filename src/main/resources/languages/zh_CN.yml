    title: "<white>确认出售</white>"
    body: "<gray>您确定要出售 <white><amount> 个 <item></white> 获得 <yellow>$<payout></yellow> 吗？</gray>\n<gray>您的余额：<yellow>$<balance></yellow></gray>"
  input:
    quantity_label: "<gray>数量：</gray>"
    promo_label: "<gray>广告宣传语：</gray>"
  blackmarket:
    title: "<white>黑市</white>"
    closed_title: "<white>黑市已关闭</white>"
    body: "<red>欢迎来到隐秘黑市。全场物品专享 <yellow><discount></yellow> 折扣！</red>\n<gray>本次营业剩余时间：<aqua><remaining></aqua></gray>\n<gray>您的余额：<yellow>$<balance></yellow></gray>\n<dark_gray>注意：交易期间角色将处于定身状态。</dark_gray>"
  promosi:
    title: "<white>商业推广</white>"
    body: "<gray>租用全服自动播报广告位。</gray>\n<gray>费用：<yellow>$<cost></yellow> | 轮播时长：<yellow><duration> 分钟</yellow></gray>\n<gray>活跃槽位：<yellow><active_count>/<max_slots></yellow> | 余额：<yellow>$<balance></yellow></gray>"
  jobs:
    title: "<white>职业</white>"
    no_job_title: "<white>职业</white>"
    no_job_body: "<white>您当前尚未选择任何职业。</white>\n\n<gray>职业系统允许您在日常活动（如挖矿、砍树、打怪等）中轻松赚取 <yellow>金币</yellow> 与 <aqua>职业经验</aqua>。</gray>\n\n<gray>核心优势与特色：</gray>\n<gray>• <white>10 种独具特色的职业</white>，适配不同的游玩风格。</gray>\n<gray>• 升至 50 级解锁强力 <green>永久自身被动增益</green>。</gray>\n<gray>• 释放 <aqua>团队光环增益</aqua>，守护周围 10 格内的队友。</gray>\n\n<dark_gray>请点击下方按钮选择您的第一份职业，或查阅指南。</dark_gray>"
    body: "<white>您的职业详情：</white>\n\n<gray>职业：<yellow><job></yellow></gray>\n<gray>等级：<white><level></white><gray>/<max_level></gray> | 经验：<aqua><exp></aqua><gray>/<req_exp></gray> (<green><exp_percent>%</green>)</gray>\n\n<gray>自身增益 (50级)：<green><self_buff></green></gray>\n<gray>附近光环增益：<aqua><aura_buff></aqua></gray>\n\n<dark_gray>注意：更换职业需要花费 $<reset_cost> 并重置等级为 1 级。</dark_gray>"
    select_title: "<white>选择职业</white>"
    select_body: "<gray>请在下方 10 个职业中选择查看详情或进行转职：</gray>"
    btn_choose_now: "<green>立即选择职业</green>"
    btn_change_job: "<gold>更换职业</gold>"
    btn_guide: "<yellow>职业指南与技巧</yellow>"
    btn_main_menu: "<aqua>返回主菜单</aqua>"
    btn_select_job: "<green>选择此职业</green>"
  jobs_guide:
    title: "<white>职业指南</white>"
    body: "<white>职业机制综合指引：</white>\n\n<yellow>1. 获取经验与金币</yellow>\n<gray>任何符合您职业本职的操作（如矿工挖矿、伐木工砍树、渔夫钓鱼等）均会即时获得 <yellow>金币</yellow> 并增加 <aqua>职业经验</aqua>。</gray>\n\n<yellow>2. 等级与成长</yellow>\n<gray>职业等级上限为 <white>50 级</white>。等级越高，单次行动收益越高。</gray>\n\n<yellow>3. 满级精通增益 (50 级)</yellow>\n<gray>达到 50 级后，您将解锁专属于自己的 <green>永久自身增益</green>，并周期性向周围 10 格内的盟友辐射 <aqua>光环增益</aqua>。</gray>\n\n<yellow>4. 更换职业</yellow>\n<gray>您可以随时支付 <yellow>$<reset_cost></yellow> 手续费转职，新职业等级将从 1 级重新开始计算。</gray>"
    btn_all_jobs: "<yellow>查看全部 10 种职业与增益</yellow>"
    list_title: "<white>职业列表总览</white>"
    list_body: "<gray>点击下方职业以查看对应活动及 50 级专属增益：</gray>"
  job_details:
    title: "<white><job></white>"
    body: "<white>职业：<yellow><job></yellow></white>\n<gray><description></gray>\n\n<white>满级奖励 (50 级)：</white>\n<gray>• 自身增益：<green><self_buff></green></gray>\n<gray>• 周围光环增益：<aqua><aura_buff></aqua></gray>\n\n<white>就职/转职要求：</white>\n<gray>• 手续费：<yellow>$<cost></yellow></gray>\n<gray>• 您的余额：<yellow>$<balance></yellow></gray>\n\n<dark_gray>注意：更换职业后等级将重置为 1 级。</dark_gray>"
  job_confirm:
    title: "<white>确认更换职业</white>"
    body: "<red>警告：转职为 <white><job></white> 将收取 <yellow>$<cost></yellow> 手续费，且等级将重置为 1 级！</red>\n\n<gray>您确定要继续吗？</gray>"
