  buy_confirm:
    title: "<white>Confirmar Compra</white>"
    body: "<gray>¿Estás seguro de que deseas comprar <white><amount>x <item></white> por <yellow>$<cost></yellow>?</gray>\n<gray>Tu saldo: <yellow>$<balance></yellow></gray>"
  sell_input:
    title: "<white>Vender <item></white>"
    body: "<gray>Introduce la cantidad de <white><item></white> que deseas vender.</gray>\n<gray>Pago unitario: <gold>$<unit_payout></gold> | En Inventario: <yellow><inv_count></yellow></gray>"
  sell_confirm:
    title: "<white>Confirmar Venta</white>"
    body: "<gray>¿Estás seguro de que deseas vender <white><amount>x <item></white> por <yellow>$<payout></yellow>?</gray>\n<gray>Tu saldo: <yellow>$<balance></yellow></gray>"
  input:
    quantity_label: "<gray>Cantidad:</gray>"
    promo_label: "<gray>Mensaje de anuncio:</gray>"
  blackmarket:
    title: "<white>Mercado Negro</white>"
    closed_title: "<white>Mercado Negro Cerrado</white>"
    body: "<red>Bienvenido al clandestino Mercado Negro. ¡Todos los objetos tienen un descuento de <yellow><discount></yellow>!</red>\n<gray>Tiempo restante de sesión: <aqua><remaining></aqua></gray>\n<gray>Tu saldo: <yellow>$<balance></yellow></gray>\n<dark_gray>Nota: No puedes moverte mientras operas aquí.</dark_gray>"
  promosi:
    title: "<white>Promociones</white>"
    body: "<gray>Alquila una transmisión automática de anuncios para todo el servidor.</gray>\n<gray>Costo: <yellow>$<cost></yellow> | Duración: <yellow><duration> minutos</yellow></gray>\n<gray>Espacios activos: <yellow><active_count>/<max_slots></yellow> | Saldo: <yellow>$<balance></yellow></gray>"
  jobs:
    title: "<white>Trabajos</white>"
    no_job_title: "<white>Trabajos</white>"
    no_job_body: "<white>Actualmente no has elegido ninguna profesión activa.</white>\n\n<gray>El sistema de trabajos te permite ganar <yellow>dinero</yellow> y <aqua>EXP de Trabajo</aqua> cada vez que realizas actividades de tu profesión.</gray>\n\n<gray>Beneficios y Características:</gray>\n<gray>• <white>10 Profesiones Únicas</white> según tu estilo de juego.</gray>\n<gray>• <green>Mejora Pasiva Permanente</green> desbloqueada en Nivel 50.</gray>\n<gray>• <aqua>Mejora de Aura</aqua> compartida con aliados cercanos (10 bloques).</gray>\n\n<dark_gray>Elige tu primera profesión o lee la guía abajo.</dark_gray>"
    body: "<white>Detalles de tu Profesión:</white>\n\n<gray>Profesión: <yellow><job></yellow></gray>\n<gray>Nivel: <white><level></white><gray>/<max_level></gray> | EXP: <aqua><exp></aqua><gray>/<req_exp></gray> (<green><exp_percent>%</green>)</gray>\n\n<gray>Mejora Personal (Nv 50): <green><self_buff></green></gray>\n<gray>Mejora de Aura Cercana: <aqua><aura_buff></aqua></gray>\n\n<dark_gray>Nota: Cambiar de trabajo cuesta $<reset_cost> y reinicia el nivel a 1.</dark_gray>"
    select_title: "<white>Elegir Profesión</white>"
    select_body: "<gray>Selecciona una de las 10 profesiones abajo para ver detalles o cambiar.</gray>"
    btn_choose_now: "<green>Elegir Trabajo Ahora</green>"
    btn_change_job: "<gold>Cambiar Trabajo</gold>"
    btn_guide: "<yellow>Guía & Consejos de Trabajos</yellow>"
    btn_main_menu: "<aqua>Volver al Menú Principal</aqua>"
    btn_select_job: "<green>Elegir este Trabajo</green>"
  jobs_guide:
    title: "<white>Guía de Trabajos</white>"
    body: "<white>Guía del Sistema de Trabajos:</white>\n\n<yellow>1. Ganar EXP y Dinero</yellow>\n<gray>Cada acción que coincida con tu profesión (como minar para el Minero, talar para el Leñador, pescar para el Pescador, etc.) otorga <yellow>dinero</yellow> directo a tu cuenta y <aqua>EXP de Trabajo</aqua>.</gray>\n\n<yellow>2. Progresión y Niveles</yellow>\n<gray>El nivel máximo es <white>Nivel 50</white>. A mayor nivel, mayores serán los ingresos por cada actividad.</gray>\n\n<yellow>3. Mejoras de Maestría (Nivel 50)</yellow>\n<gray>Al alcanzar el Nivel 50 desbloqueas una <green>Mejora Pasiva Permanente</green> para ti, y una <aqua>Aura</aqua> que beneficia periódicamente a jugadores en un radio de 10 bloques.</gray>\n\n<yellow>4. Cambiar de Trabajo</yellow>\n<gray>Puedes cambiar de trabajo en cualquier momento por una tarifa de <yellow>$<reset_cost></yellow>. La nueva profesión comenzará en Nivel 1.</gray>"
    btn_all_jobs: "<yellow>Ver las 10 Profesiones y Mejoras</yellow>"
    list_title: "<white>Resumen de Profesiones</white>"
    list_body: "<gray>Selecciona una profesión para ver sus tareas y mejoras de Nivel 50:</gray>"
  job_details:
    title: "<white><job></white>"
    body: "<white>Profesión: <yellow><job></yellow></white>\n<gray><description></gray>\n\n<white>Recompensas de Nivel Máximo (Nv 50):</white>\n<gray>• Mejora Personal: <green><self_buff></green></gray>\n<gray>• Aura de Jugadores Cercanos: <aqua><aura_buff></aqua></gray>\n\n<white>Requisitos de Cambio:</white>\n<gray>• Tarifa de Cambio: <yellow>$<cost></yellow></gray>\n<gray>• Tu Saldo: <yellow>$<balance></yellow></gray>\n\n<dark_gray>Nota: Cambiar de trabajo reinicia el nivel a 1.</dark_gray>"
  job_confirm:
    title: "<white>Confirmar Cambio de Trabajo</white>"
    body: "<red>Advertencia: ¡Cambiar de trabajo a <white><job></white> costará <yellow>$<cost></yellow> y REINICIARÁ tu nivel a 1!</red>\n\n<gray>¿Deseas continuar?</gray>"
