dialog:
  general:
    btn_confirm: "<green>確認</green>"
    btn_cancel: "<red>キャンセル</red>"
    btn_back: "<gray>戻る</gray>"
    btn_close: "<red>閉じる</red>"
  market:
    title: "<white>マーケット</white>"
    body: "<gray>公式マーケットへようこそ。下のカテゴリーを選択して商品をご覧ください。</gray>\n<gray>所持金残高: <yellow>$<balance></yellow></gray>"
  category:
    title: "<white><category></white>"
    body: "<gray><yellow><category></yellow> カタログからアイテムを選択して売買を行えます。</gray>\n<gray>所持金残高: <yellow>$<balance></yellow></gray>"
  item_action:
    title: "<white><item></white>"
    body: "<gray>アイテム: <white><item></white></gray>\n<gray>購入価格: <green>$<buy_price></green></gray>\n<gray>売却価格: <gold>$<sell_price></gold></gray>\n<gray>所持数: <yellow><inv_count></yellow></gray>\n<gray>残高: <yellow>$<balance></yellow></gray>"
  buy_input:
    title: "<white><item> の購入</white>"
    body: "<gray>購入したい <white><item></white> の数量を入力してください。</gray>\n<gray>単価: <green>$<unit_price></green> | 残高: <yellow>$<balance></yellow></gray>"
  buy_confirm:
    title: "<white>購入の確認</white>"
    body: "<gray>本当に <white><amount>個の <item></white> を <yellow>$<cost></yellow> で購入しますか？</gray>\n<gray>所持金残高: <yellow>$<balance></yellow></gray>"
  sell_input:
    title: "<white><item> の売却</white>"
    body: "<gray>売却したい <white><item></white> の数量を入力してください。</gray>\n<gray>売却単価: <gold>$<unit_payout></gold> | 所持数: <yellow><inv_count></yellow></gray>"
  sell_confirm:
    title: "<white>売却の確認</white>"
    body: "<gray>本当に <white><amount>個の <item></white> を <yellow>$<payout></yellow> で売却しますか？</gray>\n<gray>所持金残高: <yellow>$<balance></yellow></gray>"
  input:
    quantity_label: "<gray>数量:</gray>"
    promo_label: "<gray>広告メッセージ:</gray>"
  blackmarket:
    title: "<white>ブラックマーケット</white>"
    closed_title: "<white>ブラックマーケット閉鎖中</white>"
    body: "<red>秘密のブラックマーケットへようこそ。全品 <yellow><discount></yellow> 割引中！</red>\n<gray>今セッションの残り時間: <aqua><remaining></aqua></gray>\n<gray>所持金残高: <yellow>$<balance></yellow></gray>\n<dark_gray>注意: 取引中は移動できません。</dark_gray>"
  promosi:
    title: "<white>広告プロモーション</white>"
    body: "<gray>全サーバー自動告知広告枠をレンタルします。</gray>\n<gray>費用: <yellow>$<cost></yellow> | 放送時間: <yellow><duration> 分</yellow></gray>\n<gray>使用中枠: <yellow><active_count>/<max_slots></yellow> | 残高: <yellow>$<balance></yellow></gray>"
  jobs:
    title: "<white>職業</white>"
    no_job_title: "<white>職業</white>"
    no_job_body: "<white>現在、職業に就いていません。</white>\n\n<gray>職業システムでは、日々の活動（採掘・伐採・戦闘など）に応じて <yellow>お金</yellow> と <aqua>職業EXP</aqua> を手軽に稼ぐことができます。</gray>\n\n<gray>主なメリット・特徴:</gray>\n<gray>• プレイスタイルに合わせた <white>全10種類の職業</white>。</gray>\n<gray>• レベル50到達で <green>永続パッシブバフ</green> 解放！</gray>\n<gray>• 周囲10ブロックの味方にも恩恵を与える <aqua>オーラバフ</aqua>。</gray>\n\n<dark_gray>下のボタンから最初の職業を選ぶか、ガイドをご確認ください。</dark_gray>"
    body: "<white>現在の職業情報:</white>\n\n<gray>職業: <yellow><job></yellow></gray>\n<gray>レベル: <white><level></white><gray>/<max_level></gray> | EXP: <aqua><exp></aqua><gray>/<req_exp></gray> (<green><exp_percent>%</green>)</gray>\n\n<gray>自己バフ (Lv 50): <green><self_buff></green></gray>\n<gray>周囲オーラバフ: <aqua><aura_buff></aqua></gray>\n\n<dark_gray>注意: 職業変更には $<reset_cost> が必要で、レベルは1にリセットされます。</dark_gray>"
    select_title: "<white>職業の選択</white>"
    select_body: "<gray>下の10種類の職業から詳細を確認して選択してください。</gray>"
    btn_choose_now: "<green>今すぐ職業を選ぶ</green>"
    btn_change_job: "<gold>職業を変更する</gold>"
    btn_guide: "<yellow>職業ガイド＆ヒント</yellow>"
    btn_main_menu: "<aqua>メインメニューへ戻る</aqua>"
    btn_select_job: "<green>この職業に就く</green>"
  jobs_guide:
    title: "<white>職業ガイド</white>"
    body: "<white>職業システム総合ガイド:</white>\n\n<yellow>1. EXPとお金の獲得方法</yellow>\n<gray>選んだ職業に合った行動（鉱夫なら採掘、木こりなら伐採など）を行うと、直接所持金に <yellow>お金</yellow> が加算され、同時に <aqua>職業EXP</aqua> が入ります。</gray>\n\n<yellow>2. レベル上限と進行</yellow>\n<gray>各職業の最高レベルは <white>レベル50</white> です。高レベルになるほど1回あたりの獲得金額が増加します。</gray>\n\n<yellow>3. レベル50到達特典 (極意バフ)</yellow>\n<gray>レベル50に到達すると、自身への <green>永続パッシブバフ</green> と、周囲10ブロック以内の他プレイヤーに効果を共有する <aqua>オーラバフ</aqua> が解放されます。</gray>\n\n<yellow>4. 職業の変更</yellow>\n<gray>変更手数料 <yellow>$<reset_cost></yellow> を支払うことでいつでも転職可能ですが、新しい職業はレベル1からのスタートになります。</gray>"
    btn_all_jobs: "<yellow>全10種の職業とバフ一覧</yellow>"
    list_title: "<white>職業一覧</white>"
    list_body: "<gray>職業を選択すると、詳しい対象行動やLv50バフを確認できます:</gray>"
  job_details:
    title: "<white><job></white>"
    body: "<white>職業: <yellow><job></yellow></white>\n<gray><description></gray>\n\n<white>最高レベル特典 (Lv 50):</white>\n<gray>• 自身へのバフ: <green><self_buff></green></gray>\n<gray>• 周囲へのオーラバフ: <aqua><aura_buff></aqua></gray>\n\n<white>就職・変更条件:</white>\n<gray>• 手数料: <yellow>$<cost></yellow></gray>\n<gray>• 所持金残高: <yellow>$<balance></yellow></gray>\n\n<dark_gray>注意: 転職するとレベルは1にリセットされます。</dark_gray>"
  job_confirm:
    title: "<white>職業変更の確認</white>"
    body: "<red>警告: <white><job></white> への変更には <yellow>$<cost></yellow> がかかり、レベルが1にリセットされます！</red>\n\n<gray>本当に変更しますか？</gray>"
