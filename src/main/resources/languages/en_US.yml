dialog:
  general:
    btn_confirm: "<white>Confirm</white>"
    btn_cancel: "<white>Cancel</white>"
    btn_back: "<white>Back</white>"
    btn_close: "<white>Close</white>"
  market:
    title: "<white>Market</white>"
    body: "<white>Server Market Catalog:</white>\n\n<gray>Welcome to the official server market. Select a category below to browse items.</gray>\n\n<white>Account Information:</white>\n<gray>• Your Current Balance:</gray> <white>$<balance></white>"
  category:
    title: "<white><category></white>"
    body: "<white>Category: <category></white>\n\n<gray>Select an item from the catalog to purchase or sell.</gray>\n\n<white>Account Information:</white>\n<gray>• Your Current Balance:</gray> <white>$<balance></white>"
  item_action:
    title: "<white><item></white>"
    body: "<white>Item Specifications:</white>\n\n<gray>• Item Name:</gray> <white><item></white>\n<gray>• Buy Price:</gray> <white>$<buy_price></white>\n<gray>• Sell Price:</gray> <white>$<sell_price></white>\n<gray>• In Inventory:</gray> <white><inv_count></white>\n\n<white>Account Information:</white>\n<gray>• Your Current Balance:</gray> <white>$<balance></white>"
  buy_input:
    title: "<white>Buy <item></white>"
    body: "<white>Purchase Item:</white>\n\n<gray>Enter the quantity of <white><item></white> you want to purchase.</gray>\n<gray>• Unit Price:</gray> <white>$<unit_price></white>\n<gray>• Your Balance:</gray> <white>$<balance></white>"
  buy_confirm:
    title: "<white>Confirm Purchase</white>"
    body: "<white>Confirm Purchase Transaction:</white>\n\n<gray>Are you sure you want to purchase <white><amount>x <item></white> for <white>$<cost></white>?</gray>\n\n<gray>• Balance After Purchase:</gray> <white>$<balance></white>"
  sell_input:
    title: "<white>Sell <item></white>"
    body: "<white>Sell Item:</white>\n\n<gray>Enter the quantity of <white><item></white> you want to sell.</gray>\n<gray>• Unit Payout:</gray> <white>$<unit_payout></white>\n<gray>• In Inventory:</gray> <white><inv_count></white>"
  sell_confirm:
    title: "<white>Confirm Sale</white>"
    body: "<white>Confirm Sale Transaction:</white>\n\n<gray>Are you sure you want to sell <white><amount>x <item></white> for <white>$<payout></white>?</gray>\n\n<gray>• Balance After Sale:</gray> <white>$<balance></white>"
  input:
    quantity_label: "Quantity:"
    promo_label: "Advertisement message:"
  blackmarket:
    title: "<white>Black Market</white>"
    closed_title: "<white>Black Market Closed</white>"
    body: "<white>Secret Black Market:</white>\n\n<gray>All contraband items feature a special discount of <white><discount></white>!</gray>\n<gray>• Time Remaining in Session:</gray> <white><remaining></white>\n<gray>• Your Current Balance:</gray> <white>$<balance></white>\n\n<gray>Note: You cannot move while interacting with the black market.</gray>"
  promosi:
    title: "<white>Promotions</white>"
    body: "<white>Rent Server Promotion Slot:</white>\n\n<gray>Broadcast your advertisement regularly to all online players.</gray>\n<gray>• Rental Cost:</gray> <white>$<cost></white>\n<gray>• Broadcast Duration:</gray> <white><duration> minutes</white>\n<gray>• Active Slots:</gray> <white><active_count>/<max_slots></white>\n<gray>• Your Balance:</gray> <white>$<balance></white>"
  jobs:
    title: "<white>Jobs</white>"
    no_job_title: "<white>Jobs</white>"
    no_job_body: "<white>Profession Status: No Active Profession</white>\n\n<gray>The jobs system provides continuous earnings in money and Job EXP as you perform activities.</gray>\n\n<white>Benefits & Features:</white>\n<gray>• 10 Unique Professions tailored to your playstyle.</gray>\n<gray>• Permanent Self Buff unlocked upon reaching Level 50.</gray>\n<gray>• Aura Buff automatically radiated to allies within 10 blocks.</gray>\n<gray>• Access to Job Quests for accelerated progression and bonus rewards.</gray>\n\n<gray>Click the buttons below to select your first job or read the comprehensive guide.</gray>"
    body: "<white>Your Profession Information:</white>\n\n<white>Profession:</white> <white><job></white>\n<white>Level:</white> <white><level></white><gray>/<max_level></gray> | <white>EXP:</white> <white><exp></white><gray>/<req_exp></gray> <gray>(<exp_percent>%)</gray>\n\n<gray>Open Job Details to view your buffs, progression, job quests, or resign from this profession.</gray>"
    select_title: "<white>Select Profession</white>"
    select_body: "<gray>Select one of the 10 professions below to view details and switch.</gray>"
    btn_choose_now: "<white>Choose Profession Now</white>"
    btn_details: "<white>Job Details</white>"
    btn_change_job: "<white>Switch Profession</white>"
    btn_guide: "<white>Jobs Guide & Tips</white>"
    btn_main_menu: "<white>Return to Main Menu</white>"
    btn_select_job: "<white>Switch to this Job</white>"
    btn_quests: "<white>Job Quests</white>"
    btn_resign: "<white>Resign from Job</white>"
    active_title: "<white>Job Details: <job></white>"
    active_body: "<white>Profession Overview: <job></white>\n\n<white>Level Progression:</white>\n<gray>• Current Level:</gray> <white><level></white><gray>/<max_level></gray>\n<gray>• Total EXP:</gray> <white><exp></white><gray>/<req_exp></gray> <gray>(<exp_percent>%)</gray>\n\n<white>Earning Activities:</white>\n<gray><description></gray>\n\n<white>Level 50 Master Rewards:</white>\n<gray>• Self Buff:</gray> <white><self_buff></white>\n<gray>• Nearby Aura Buff (10 blocks):</gray> <white><aura_buff></white>\n\n<gray>Complete Job Quests to accelerate your progression towards the next level.</gray>"
    quests_title: "<white>Job Quests: <job></white>"
    quests_body: "<white>Mission & Quest Center: <job></white>\n\n<gray>Complete daily tasks and specialization challenges for this profession to earn substantial coin and Job EXP bonuses.</gray>\n\n<white>Available Quest Categories:</white>\n<gray>• Daily Quests: Routine tasks with daily coin & EXP rewards.</gray>\n<gray>• Specialist Challenges: Large-scale challenges for your profession.</gray>\n<gray>• Milestone Quests: Progression quests for tier advancement.</gray>\n\n<gray>Note: Quest features link directly into the ClarityQuest ecosystem.</gray>"
    btn_quest_daily: "<white>Daily Quests</white>"
    btn_quest_specialist: "<white>Specialist Challenges</white>"
    btn_quest_milestone: "<white>Milestone Quests</white>"
    quest_detail_title: "<white>Quest Info: <category></white>"
    quest_detail_body: "<white>Quest Category: <category></white>\n\n<white>Status:</white> <white>Available</white>\n<gray>Objective: Perform activities matching your <white><job></white> profession to complete this quest.</gray>\n<gray>Rewards: Multiplied Vault Coins & Job EXP.</gray>\n\n<gray>Note: Full integration is prepared alongside the ClarityQuest plugin.</gray>"
    resign_title: "<white>Resign from Job</white>"
    resign_body: "<white>Resignation from Profession <job>:</white>\n\n<gray>Are you sure you want to resign from your <white><job></white> profession?</gray>\n\n<white>Fee & Consequences:</white>\n<gray>• Resignation Fee:</gray> <white>$<cost></white>\n<gray>• Current Balance:</gray> <white>$<balance></white>\n<gray>• Your progress for this profession will be reset back to Level 1.</gray>\n\n<gray>After resigning, you may immediately select a new profession in the jobs menu.</gray>"
    btn_confirm_resign: "<white>Confirm Resignation</white>"
  jobs_guide:
    title: "<white>Jobs Guide</white>"
    body: "<white>Jobs System Guide & Mechanics:</white>\n\n<white>1. Earning EXP & Currency</white>\n<gray>Every action matching your chosen profession directly awards money to your balance and adds Job EXP.</gray>\n\n<white>2. Leveling & Progression</white>\n<gray>Professions cap at Level 50. Higher job levels increase earnings and progression efficiency.</gray>\n\n<white>3. Level 50 Mastery Buffs</white>\n<gray>Reaching Level 50 unlocks a powerful Permanent Self Buff and radiates an Aura Buff to all players within a 10-block radius.</gray>\n\n<white>4. Resigning & Switching Professions</white>\n<gray>You may resign from your profession at any time through the Job Details menu for an administrative fee of $<reset_cost>. After resigning, you can select a new profession.</gray>"
    btn_all_jobs: "<white>List All 10 Jobs & Buffs</white>"
    list_title: "<white>Professions Overview</white>"
    list_body: "<gray>Select a profession below to view its specific tasks and Lv 50 buffs:</gray>"
  job_details:
    title: "<white><job></white>"
    body: "<white>Profession: <job></white>\n<gray><description></gray>\n\n<white>Max Level Rewards (Lv 50):</white>\n<gray>• Self Buff:</gray> <white><self_buff></white>\n<gray>• Nearby Aura Buff:</gray> <white><aura_buff></white>\n\n<white>Selection / Switching Requirements:</white>\n<gray>• Reset Fee:</gray> <white>$<cost></white>\n<gray>• Your Balance:</gray> <white>$<balance></white>\n\n<gray>Note: Switching jobs resets your job progress to Level 1.</gray>"
  job_confirm:
    title: "<white>Confirm Job Change</white>"
    body: "<white>Profession Change Warning:</white>\n\n<gray>Changing your job to <white><job></white> will cost <white>$<cost></white> and reset your level to 1.</gray>\n\n<gray>Do you want to proceed?</gray>"
