dialog:
  general:
    btn_confirm: "<green>Bestätigen</green>"
    btn_cancel: "<red>Abbrechen</red>"
    btn_back: "<gray>Zurück</gray>"
    btn_close: "<red>Schließen</red>"
  market:
    title: "<white>Markt</white>"
    body: "<gray>Willkommen auf dem offiziellen Markt. Wähle unten eine Kategorie, um Gegenstände zu durchstöbern.</gray>\n<gray>Dein Guthaben: <yellow>$<balance></yellow></gray>"
  category:
    title: "<white><category></white>"
    body: "<gray>Wähle einen Gegenstand aus dem Katalog <yellow><category></yellow> zum Kaufen oder Verkaufen.</gray>\n<gray>Dein Guthaben: <yellow>$<balance></yellow></gray>"
  item_action:
    title: "<white><item></white>"
    body: "<gray>Gegenstand: <white><item></white></gray>\n<gray>Kaufpreis: <green>$<buy_price></green></gray>\n<gray>Verkaufspreis: <gold>$<sell_price></gold></gray>\n<gray>Im Inventar: <yellow><inv_count></yellow></gray>\n<gray>Guthaben: <yellow>$<balance></yellow></gray>"
  buy_input:
    title: "<white><item> kaufen</white>"
    body: "<gray>Gib die gewünschte Kaufmenge für <white><item></white> ein.</gray>\n<gray>Stückpreis: <green>$<unit_price></green> | Guthaben: <yellow>$<balance></yellow></gray>"
  buy_confirm:
    title: "<white>Kauf bestätigen</white>"
    body: "<gray>Möchtest du wirklich <white><amount>x <item></white> für <yellow>$<cost></yellow> kaufen?</gray>\n<gray>Dein Guthaben: <yellow>$<balance></yellow></gray>"
  sell_input:
    title: "<white><item> verkaufen</white>"
    body: "<gray>Gib die gewünschte Verkaufsmenge für <white><item></white> ein.</gray>\n<gray>Stückauszahlung: <gold>$<unit_payout></gold> | Im Inventar: <yellow><inv_count></yellow></gray>"
  sell_confirm:
    title: "<white>Verkauf bestätigen</white>"
    body: "<gray>Möchtest du wirklich <white><amount>x <item></white> für <yellow>$<payout></yellow> verkaufen?</gray>\n<gray>Dein Guthaben: <yellow>$<balance></yellow></gray>"
  input:
    quantity_label: "<gray>Menge:</gray>"
    promo_label: "<gray>Werbenachricht:</gray>"
  blackmarket:
    title: "<white>Schwarzmarkt</white>"
    closed_title: "<white>Schwarzmarkt Geschlossen</white>"
    body: "<red>Willkommen auf dem Schwarzmarkt. Alle Gegenstände sind um <yellow><discount></yellow> reduziert!</red>\n<gray>Verbleibende Zeit dieser Sitzung: <aqua><remaining></aqua></gray>\n<gray>Dein Guthaben: <yellow>$<balance></yellow></gray>\n<dark_gray>Hinweis: Während der Transaktion kannst du dich nicht bewegen.</dark_gray>"
  promosi:
    title: "<white>Werbung</white>"
    body: "<gray>Miete einen automatisierten serverweiten Werbeslot.</gray>\n<gray>Kosten: <yellow>$<cost></yellow> | Sendedauer: <yellow><duration> Minuten</yellow></gray>\n<gray>Aktive Slots: <yellow><active_count>/<max_slots></yellow> | Guthaben: <yellow>$<balance></yellow></gray>"
  jobs:
    title: "<white>Berufe</white>"
    no_job_title: "<white>Berufe</white>"
    no_job_body: "<white>Du hast derzeit noch keinen aktiven Beruf gewählt.</white>\n\n<gray>Berufe belohnen dich bei jeder passenden Tätigkeit mit <yellow>Geld</yellow> und <aqua>Berufs-XP</aqua>.</gray>\n\n<gray>Vorteile & Funktionen:</gray>\n<gray>• <white>10 einzigartige Berufe</white> passend zu deinem Spielstil.</gray>\n<gray>• <green>Permanenter Eigenbuff</green> ab Stufe 50.</gray>\n<gray>• <aqua>Aura-Buff</aqua> für Verbündete in 10 Blöcken Umkreis.</gray>\n\n<dark_gray>Wähle unten deinen Beruf oder lies den Ratgeber.</dark_gray>"
    body: "<white>Deine Berufsübersicht:</white>\n\n<gray>Beruf: <yellow><job></yellow></gray>\n<gray>Stufe: <white><level></white><gray>/<max_level></gray> | EXP: <aqua><exp></aqua><gray>/<req_exp></gray> (<green><exp_percent>%</green>)</gray>\n\n<gray>Eigenbuff (Stufe 50): <green><self_buff></green></gray>\n<gray>Umgebungs-Aura: <aqua><aura_buff></aqua></gray>\n\n<dark_gray>Hinweis: Berufswechsel kostet $<reset_cost> und setzt Stufe auf 1 zurück.</dark_gray>"
    select_title: "<white>Beruf wählen</white>"
    select_body: "<gray>Wähle einen der 10 Berufe unten, um Details anzuzeigen oder zu wechseln.</gray>"
    btn_choose_now: "<green>Beruf jetzt wählen</green>"
    btn_change_job: "<gold>Beruf wechseln</gold>"
    btn_guide: "<yellow>Berufsratgeber & Tipps</yellow>"
    btn_main_menu: "<aqua>Zurück zum Hauptmenü</aqua>"
    btn_select_job: "<green>Diesen Beruf wählen</green>"
  jobs_guide:
    title: "<white>Berufsratgeber</white>"
    body: "<white>Anleitung zum Berufssystem:</white>\n\n<yellow>1. EXP & Geld verdienen</yellow>\n<gray>Jede berufsspezifische Aktion (wie Erze abbauen als Bergarbeiter, Holz fällen als Holzfäller etc.) bringt direkt <yellow>Geld</yellow> und <aqua>Berufs-EXP</aqua>.</gray>\n\n<yellow>2. Stufenaufstieg</yellow>\n<gray>Die Maximalstufe beträgt <white>Stufe 50</white>. Höhere Stufen steigern die Erträge pro Tätigkeit.</gray>\n\n<yellow>3. Meister-Buffs (Stufe 50)</yellow>\n<gray>Auf Stufe 50 schaltest du einen mächtigen <green>permanenten Eigenbuff</green> frei sowie eine <aqua>Aura</aqua>, die Mitspieler im Umkreis von 10 Blöcken stärkt.</gray>\n\n<yellow>4. Beruf wechseln</yellow>\n<gray>Du kannst jederzeit für <yellow>$<reset_cost></yellow> wechseln. Die neue Stufe beginnt dabei wieder bei Stufe 1.</gray>"
    btn_all_jobs: "<yellow>Alle 10 Berufe & Buffs ansehen</yellow>"
    list_title: "<white>Berufsübersicht</white>"
    list_body: "<gray>Wähle einen Beruf, um Details zu Aufgaben und Buffs zu sehen:</gray>"
  job_details:
    title: "<white><job></white>"
    body: "<white>Beruf: <yellow><job></yellow></white>\n<gray><description></gray>\n\n<white>Belohnungen bei Maximalstufe (Stufe 50):</white>\n<gray>• Eigenbuff: <green><self_buff></green></gray>\n<gray>• Umgebungs-Aura: <aqua><aura_buff></aqua></gray>\n\n<white>Wechselbedingungen:</white>\n<gray>• Wechselgebühr: <yellow>$<cost></yellow></gray>\n<gray>• Dein Guthaben: <yellow>$<balance></yellow></gray>\n\n<dark_gray>Hinweis: Berufswechsel setzt Stufe auf 1 zurück.</dark_gray>"
  job_confirm:
    title: "<white>Berufswechsel bestätigen</white>"
    body: "<red>Warnung: Wechsel zu <white><job></white> kostet <yellow>$<cost></yellow> und setzt deine Stufe auf 1 ZURÜCK!</red>\n\n<gray>Möchtest du fortfahren?</gray>"
